services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    image: ds-gr15/server${AUFGABE_NR}
    container_name: uebung${AUFGABE_NR}-server
    ports:
      - "${HOST_HTTP_PORT}:8080"  # Exposes server's port 8080 to the host
    restart: always  # Ensures the container restarts automatically if it stops
    networks:
      static_network:
        ipv4_address: ${IP_PREFIX}.100  # Assigns a static IP to the server

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    image: ds-gr15/client${AUFGABE_NR}
    container_name: uebung${AUFGABE_NR}-client
    environment:
      - TARGET_SERVER=${IP_PREFIX}.100
    depends_on:
      - server
    networks:
      - static_network

networks:
  static_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${IP_PREFIX}.0/24  # Defines the subnet for the network
